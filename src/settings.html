<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>FloatHUD 设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #1c1c1e;
      color: #e5e5ea;
      padding: 20px;
      min-height: 100vh;
      overflow-y: auto;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .sub { color: #98989d; font-size: 12px; margin-bottom: 18px; }
    section {
      background: #2c2c2e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    section h2 {
      font-size: 13px;
      font-weight: 600;
      color: #ffd60a;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
      color: #aeaeb2;
    }
    input, select, textarea {
      background: #1c1c1e;
      color: #e5e5ea;
      border: 1px solid #3a3a3c;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #ffd60a; }
    input[type="color"] { padding: 2px; height: 36px; cursor: pointer; }
    input[type="range"] { padding: 0; height: 28px; }
    textarea { resize: vertical; min-height: 60px; font-family: Menlo, monospace; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .check {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #e5e5ea;
    }
    .check input { width: 16px; height: 16px; }
    .val { color: #ffd60a; font-variant-numeric: tabular-nums; min-width: 36px; }
    .widget {
      border: 1px solid #3a3a3c;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      background: #242426;
    }
    .widget-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .widget-head strong { font-size: 13px; color: #fff; }
    button {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary { background: #ffd60a; color: #000; }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-ghost { background: #3a3a3c; color: #e5e5ea; }
    .btn-ghost:hover { background: #48484a; }
    .btn-danger { background: #3a2020; color: #ff6961; }
    .btn-danger:hover { background: #4a2828; }
    .footer {
      position: sticky;
      bottom: 0;
      background: linear-gradient(transparent, #1c1c1e 30%);
      padding: 16px 0 8px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .hint { font-size: 11px; color: #636366; margin-top: 6px; }
    .toast {
      position: fixed;
      top: 16px;
      right: 16px;
      background: #248a3d;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.err { background: #c93400; }
  </style>
</head>
<body>
  <h1>FloatHUD 设置</h1>
  <div class="sub">改动点「保存」写入 <code>~/.float-hud/config.json</code>，保存后立即生效</div>

  <section>
    <h2>全局外观</h2>
    <div class="grid">
      <label>背景透明度
        <div class="row">
          <input type="range" id="backgroundOpacity" min="0" max="1" step="0.05" />
          <span class="val" id="backgroundOpacityVal">0.85</span>
        </div>
      </label>
      <label>全局字体
        <input type="text" id="fontFamily" placeholder="如 PingFang SC, sans-serif" />
      </label>
      <label>默认刷新间隔（秒）
        <input type="number" id="refreshSeconds" min="1" />
      </label>
    </div>
    <div class="row" style="margin-top:14px">
      <label class="check"><input type="checkbox" id="clickThrough" /> 鼠标穿透（点击落到下层）</label>
      <label class="check"><input type="checkbox" id="lockPosition" /> 固定位置（不可拖动）</label>
    </div>
    <div class="hint">窗口位置不用配——拖到哪，下次启动就在哪。</div>
  </section>

  <section>
    <h2>显示行（widgets）</h2>
    <div id="widgets"></div>
    <button class="btn-ghost" id="addWidget">＋ 添加一行</button>
  </section>

  <div class="footer">
    <button class="btn-ghost" id="reload">放弃更改</button>
    <button class="btn-primary" id="save">保存</button>
  </div>

  <div class="toast" id="toast"></div>
  <script src="./settings.js"></script>
</body>
</html>
